server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Authorization $http_authorization; proxy_set_header X-Tenant-Id $http_x_tenant_id; proxy_set_header X-Graph-Token $http_x_graph_token; }
  # Admin tool: never cache the UI so rebuilds always reach the browser.
  location ~* \.(js|css|html)$ { expires -1; add_header Cache-Control "no-store, must-revalidate"; }
  location / { try_files $uri $uri/ /index.html; }
}
